name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # windows-latest also runs the net481 test targets
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer needs the tags and history to compute the version
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build xapi-dotnet.slnx -c Release

      - name: Test
        run: |
          args=(--solution xapi-dotnet.slnx -c Release --no-build --results-directory "$GITHUB_WORKSPACE/artifacts/test-results")
          if [ "$RUNNER_OS" = Linux ]; then
            args+=(--coverage --coverage-output-format cobertura)
          fi
          dotnet test "${args[@]}"

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: artifacts/test-results/**/*.cobertura.xml
          if-no-files-found: warn

      - name: Upload received API snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: received-snapshots-${{ matrix.os }}
          path: tests/**/*.received.txt
          if-no-files-found: ignore

  pack:
    name: Pack and test packages
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # ContinuousIntegrationBuild is switched on by Directory.Build.props when GITHUB_ACTIONS is set.
      # Pack also runs package validation for every packable project.
      - name: Pack
        run: dotnet pack xapi-dotnet.slnx -c Release -o artifacts/packages

      - name: Read package version
        id: version
        run: |
          shopt -s nullglob
          files=(artifacts/packages/Xapi.Core.[0-9]*.nupkg)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one Xapi.Core nupkg, found ${#files[@]}"
            exit 1
          fi
          version=$(basename "${files[0]}" .nupkg)
          version=${version#Xapi.Core.}
          echo "Package version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Public API tests
        run: dotnet test --project tests/Xapi.PublicApi.Tests -c Release

      - name: Package tests
        env:
          XAPI_PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet test --project tests/Xapi.PackageTests -c Release -p:XapiPackageVersion="$XAPI_PACKAGE_VERSION"

      - name: Upload received API snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: received-snapshots-pack
          path: tests/**/*.received.txt
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  package-test-windows:
    name: Test packages on Windows (net10.0, net481)
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages

      - name: Package tests
        env:
          XAPI_PACKAGE_VERSION: ${{ needs.pack.outputs.version }}
        run: dotnet test --project tests/Xapi.PackageTests -c Release -p:XapiPackageVersion="$XAPI_PACKAGE_VERSION"

  client-integration:
    # Linux only: the tests start lrsql (a linux/amd64 image) through Testcontainers, and the macOS and Windows
    # runners cannot run Linux containers. The project is left out of the solution-wide `dotnet test` above unless
    # XapiIntegrationTests=true (see tests/Xapi.Client.IntegrationTests), so this job is the one place it runs.
    name: Client integration tests (lrsql)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        run: >-
          dotnet test --project tests/Xapi.Client.IntegrationTests -c Release -p:XapiIntegrationTests=true
          --results-directory "$GITHUB_WORKSPACE/artifacts/test-results"

  aot-smoke:
    name: Native AOT smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LRS_URL: http://127.0.0.1:8080/xapi
      LRS_KEY: aot_key
      LRS_SECRET: aot_secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load pinned inputs
        run: grep -E '^[A-Z_]+=' eng/conformance/cts.env >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Native AOT prerequisites
        run: dpkg -s clang zlib1g-dev > /dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y clang zlib1g-dev)

      # The trim and AOT analyzers only see what the sample reaches, so this catches what IsAotCompatible on the
      # libraries cannot: a warning from ILLink or ILC in a real native build.
      - name: Publish
        run: |
          set -o pipefail
          dotnet publish samples/ConsoleClient -c Release -o artifacts/aot 2>&1 | tee publish.log
          if grep -E '\bwarning [A-Z]+[0-9]+' publish.log; then
            echo "::error::Native AOT publish produced warnings"
            exit 1
          fi

      - name: Start lrsql
        run: |
          docker run -d --name lrs -p 8080:8080 \
            -e "LRSQL_API_KEY_DEFAULT=$LRS_KEY" -e "LRSQL_API_SECRET_DEFAULT=$LRS_SECRET" \
            -e LRSQL_ADMIN_USER_DEFAULT=aot_admin -e LRSQL_ADMIN_PASS_DEFAULT=aot_admin_pass \
            "$LRSQL_IMAGE"
          for _ in $(seq 90); do
            if curl -sf "$LRS_URL/about" > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs lrs
          echo "::error::lrsql did not start"
          exit 1

      - name: Run the native sample
        run: |
          for version in 1.0.3 2.0.0 ''; do
            XAPI_ENDPOINT="$LRS_URL" XAPI_KEY="$LRS_KEY" XAPI_SECRET="$LRS_SECRET" XAPI_VERSION="$version" artifacts/aot/ConsoleClient
          done

  docker-image:
    # Builds the samples/LrsHost image and checks that it refuses to start without credentials, stores and
    # returns a statement, and keeps it across a restart. Nothing is pushed.
    name: LRS Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LRS_URL: http://127.0.0.1:8080/xapi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -f samples/LrsHost/Dockerfile -t xapi-lrs .

      - name: Refuses to start without credentials
        run: |
          if timeout 60 docker run --rm xapi-lrs; then
            echo "::error::The image started without Lrs__Key and Lrs__Secret"
            exit 1
          fi

      - name: Stores statements and keeps them across a restart
        run: |
          wait_for_lrs() {
            for _ in $(seq 60); do
              if curl -sf "$LRS_URL/about" > /dev/null; then return 0; fi
              sleep 1
            done
            docker logs lrs
            echo "::error::The LRS did not start"
            return 1
          }
          docker run -d --name lrs -p 8080:8080 -e Lrs__Key=ci_key -e Lrs__Secret=ci_secret -v lrs-data:/data xapi-lrs
          wait_for_lrs
          id=$(cat /proc/sys/kernel/random/uuid)
          statement='{"actor":{"mbox":"mailto:ci@example.com"},"verb":{"id":"http://adlnet.gov/expapi/verbs/completed"},"object":{"id":"http://example.com/ci"}}'
          curl -sf -u ci_key:ci_secret -X PUT -H 'X-Experience-API-Version: 2.0.0' -H 'Content-Type: application/json' \
            "$LRS_URL/statements?statementId=$id" -d "$statement"
          docker restart lrs
          wait_for_lrs
          curl -sf -u ci_key:ci_secret -H 'X-Experience-API-Version: 2.0.0' "$LRS_URL/statements?statementId=$id" | grep -q "$id"
