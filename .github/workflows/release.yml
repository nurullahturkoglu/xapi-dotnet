name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer derives the package version from the tag
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build xapi-dotnet.slnx -c Release

      - name: Test
        run: dotnet test --solution xapi-dotnet.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack xapi-dotnet.slnx -c Release --no-build -o artifacts/packages

      - name: Check package version against tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          if [ ! -f "artifacts/packages/Xapi.Core.$version.nupkg" ]; then
            echo "::error::No Xapi.Core.$version.nupkg. Packed: $(ls artifacts/packages)"
            exit 1
          fi
          # The Unity package is installed from git, so its version is in its package.json
          unity=$(jq -r .version src/Xapi.Unity/package.json)
          if [ "$unity" != "$version" ]; then
            echo "::error::src/Xapi.Unity/package.json has version $unity, the tag $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package tests
        run: dotnet test --project tests/Xapi.PackageTests -c Release -p:XapiPackageVersion="$VERSION"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v heading="## [$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > artifacts/release-notes.md
          if ! grep -q '[^[:space:]]' artifacts/release-notes.md; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi
          cat artifacts/release-notes.md

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/packages/*.nupkg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            artifacts/packages/*.nupkg
            artifacts/release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The nuget environment has a required reviewer: nothing below runs until the maintainer approves it
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Trusted publishing: exchanges the workflow's OIDC token for a short-lived nuget.org API key
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" artifacts/packages/*.nupkg \
            --draft --verify-tag --title "$TAG" \
            --notes-file artifacts/release-notes.md \
            "${prerelease[@]}"

  image:
    name: Publish the LRS image to ghcr.io
    # After the approved publish job, so the same approval releases the packages and the image
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/nurullahturkoglu/xapi-lrs
      # Puts the OCI annotations on the multi-platform index too, where ghcr.io reads the source repository,
      # description and license of a multi-platform image
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      # A tag push checks out the tagged commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          latest=true
          if [[ "$version" == *-* ]]; then
            latest=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # QEMU runs the arm64 RUN steps of the runtime stage; the SDK stage builds on the runner's platform
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest }}
          labels: |
            org.opencontainers.image.title=xapi-lrs
            org.opencontainers.image.description=The samples/LrsHost xAPI LRS from xapi-dotnet, on SQLite or PostgreSQL
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=xapi-lrs
            org.opencontainers.image.description=The samples/LrsHost xAPI LRS from xapi-dotnet, on SQLite or PostgreSQL
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: samples/LrsHost/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # The signed provenance comes from actions/attest below; BuildKit's own would add unknown/unknown
          # entries to the image index
          provenance: false
          push: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records are only for organization-owned repositories
          create-storage-record: false
