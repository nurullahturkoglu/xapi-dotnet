version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
    # The netstandard2.0 dependency floors in Directory.Packages.props are the lowest usable versions, not the
    # newest, and are only raised on purpose (CONTRIBUTING.md, "Dependency floors")
    ignore:
      - dependency-name: System.Text.Json
      - dependency-name: Microsoft.Bcl.AsyncInterfaces
      - dependency-name: Microsoft.Bcl.TimeProvider
      - dependency-name: System.Diagnostics.DiagnosticSource

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # global.json pins the SDK feature band so local builds and CI run the same analyzers
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /samples/LrsHost
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
